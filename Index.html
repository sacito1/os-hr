<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR โรงพิมพ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#162030; --muted:#5b6677; --line:#dbe0e7;
  --accent:#1670b8; --accent-soft:#dcebf8; --accent-ink:#ffffff;
  --good:#1d7f47; --good-soft:#d8f0e1; --warn:#a66a10; --warn-soft:#fbecd2; --bad:#bf352e; --bad-soft:#f9dad7;
  --off-bg:#f2aaa4; --off-ink:#5e1612; --hol-bg:#fbd3e0; --wk-bg:#d4e4f6; --leave-bg:#e3dcf7; --leave-ink:#4b3a8c;
  --sh-s:58%; --sh-l:83%; --sh-ink:#1a2433;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Myanmar",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Myanmar",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"IBM Plex Sans Thai","Noto Sans Myanmar",monospace;
  --r:8px; color-scheme:light;
  --c-ok:#0ca30c; --c-leave:#4a3aa7; --c-late:#eda100; --c-absent:#d03b3b; --c-bar:#2a78d6; --grid:#e3e7ec;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#171f2a; --surface-2:#1e2835; --ink:#e5e9ef; --muted:#97a2b2; --line:#2a3544;
  --accent:#58b0ea; --accent-soft:#16304a; --accent-ink:#06121c;
  --good:#5cc78a; --good-soft:#163527; --warn:#e2a54a; --warn-soft:#3a2b14; --bad:#f07a71; --bad-soft:#3f1d1b;
  --off-bg:#6a2b27; --off-ink:#ffd9d5; --hol-bg:#4c2737; --wk-bg:#1d3149; --leave-bg:#2f2850; --leave-ink:#cfc4ff;
  --sh-s:32%; --sh-l:30%; --sh-ink:#eef2f7; color-scheme:dark;
  --c-ok:#0ca30c; --c-leave:#9085e9; --c-late:#c98500; --c-absent:#d03b3b; --c-bar:#3987e5; --grid:#26303d;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.reg{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;position:relative;flex:none}
.reg::before,.reg::after{content:"";position:absolute;background:var(--ink)}
.reg::before{left:50%;top:-5px;bottom:-5px;width:2px;transform:translateX(-50%)}
.reg::after{top:50%;left:-5px;right:-5px;height:2px;transform:translateY(-50%)}
.spacer{flex:1}
html[lang=my] body{line-height:1.75}
html[lang=my] .punch{line-height:1.5}
.lang-row{display:flex;justify-content:center;gap:6px}
.segs{display:flex;flex-direction:column;gap:8px}
.seg-time{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.seg-time b{font-size:1.15rem}
.big-punch{width:100%;min-height:72px}
.ot-in{width:100%}
.slip{display:flex;flex-direction:column;gap:10px}
.slip .sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.slip table{width:100%;border-collapse:collapse;font-size:.9rem}
.slip td{padding:5px 2px;border-bottom:1px solid var(--line)}
.slip td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.slip tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.slip .net{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-weight:700;font-size:1.1rem}
.slip .net b{font-family:var(--f-display);font-size:1.5rem}
.slip .sub{font-size:.8rem;color:var(--muted)}
.wage-in{width:110px;text-align:right}
.mult-sel{width:auto;min-width:0;padding:3px 6px}
@media print{body>*:not(#install){display:none!important}.sheet-bg{position:static;background:none;padding:0}.sheet{box-shadow:none;max-height:none;max-width:none}.no-print{display:none!important}}
.lang-row button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 12px;font-size:.85rem;cursor:pointer}
.lang-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ph-head{position:relative}
.ph-lang{position:absolute;top:14px;right:14px;border:1px solid rgb(255 255 255 / .5);background:rgb(255 255 255 / .15);color:inherit;border-radius:99px;padding:2px 10px;font-size:.8rem;cursor:pointer}
.inst-btn{display:inline-flex;align-items:center;gap:6px}
.in-app #install-btn{display:none!important}
.inst-btn svg{width:16px;height:16px}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.sheet-bg{align-items:center}}
.sheet{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 12px 40px rgb(0 0 0 / .3);padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:1.1rem}
.sheet .seg{width:100%;grid-template-columns:repeat(3,1fr)}
.sheet .seg button{padding:6px 6px;font-size:.85rem}
.sheet .note{text-align:left;color:var(--warn)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:1px}
.steps b{font-weight:700}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;font-family:var(--f-mono);font-size:.85rem}

.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat}
@media (prefers-reduced-motion:no-preference){.busy{animation:slide 1s linear infinite}@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 56px)}
.nav{border-right:1px solid var(--line);background:var(--surface);padding-block:14px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:9px 18px;cursor:pointer;color:var(--muted);border-left:3px solid transparent}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;display:inline-grid;place-items:center;font-weight:600}
.main{padding:20px 22px 48px;min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.head p{margin:2px 0 0;color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:52px;z-index:20}
  .nav button{border-left:0;border-bottom:3px solid transparent;padding:11px 12px;white-space:nowrap}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent);background:none}
  .main{padding:16px 16px 48px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.ctl{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.days-pick{display:flex;flex-wrap:wrap;gap:6px}
.days-pick label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.85rem;color:var(--ink);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.absent,.pill.missing,.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.leave,.pill.pending{background:var(--leave-bg);color:var(--leave-ink)} .pill.approved{background:var(--good-soft);color:var(--good)}
.pill.off,.pill.na,.pill.wait,.pill.future,.pill.cancelled{background:var(--surface-2);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;font-size:.78rem;letter-spacing:.03em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px}
.who b{display:block;font-weight:600} .who span{font-size:.8rem;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;background:hsl(var(--h) var(--sh-s) var(--sh-l));border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:var(--f-display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.82rem;color:var(--muted)}
.tile.good .n{color:var(--good)} .tile.warn .n{color:var(--warn)} .tile.bad .n{color:var(--bad)} .tile.lv .n{color:var(--leave-ink)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}

.sched-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav strong{font-family:var(--f-display);font-size:1.05rem;min-width:150px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.shift-chips{display:flex;flex-wrap:wrap;gap:8px}
.shift-chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;background:hsl(var(--h) var(--sh-s) var(--sh-l));color:var(--sh-ink);font-size:.82rem}
.shift-chip b{font-weight:600}
.grid-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sg{border-collapse:separate;border-spacing:0;font-size:.78rem}
.sg th,.sg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sg thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);padding:5px 2px;min-width:46px;text-align:center;font-weight:600;line-height:1.2}
.sg thead th small{display:block;font-weight:400;color:var(--muted)}
.sg thead th.wk{background:var(--wk-bg)} .sg thead th.hol{background:var(--hol-bg)}
.sg thead th.today{box-shadow:inset 0 0 0 2px var(--accent)}
.sg .emp{position:sticky;left:0;z-index:2;background:var(--surface);min-width:170px;max-width:200px;padding:5px 10px;text-align:left}
.sg thead .emp{z-index:4;background:var(--surface-2)}
.sg .emp b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.75rem;color:var(--muted)}
.sg .emp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
.sg td.c{padding:0;background:hsl(var(--h) var(--sh-s) var(--sh-l));color:var(--sh-ink);position:relative}
.sg td.c.off{background:var(--off-bg);color:var(--off-ink)}
.sg td.c.lv{background:repeating-linear-gradient(135deg,var(--leave-bg) 0 6px,transparent 6px 11px),hsl(var(--h) var(--sh-s) var(--sh-l))}
.sg td.c.dirty{outline:2px dashed var(--accent);outline-offset:-3px}
.sg td.c .in{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0 4px}
.sg td.c .code{border:0;background:none;color:inherit;font-size:.74rem;white-space:nowrap;cursor:pointer;padding:1px 4px;border-radius:3px}
.sg td.c .code:hover{background:rgb(0 0 0 / .08)}
.sg td.c input{margin:0;width:14px;height:14px;cursor:pointer;accent-color:var(--bad)}
.pop{position:fixed;z-index:50;width:220px;max-height:330px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 28px rgb(0 0 0 / .22);padding:6px}
.pop .ph{padding:6px 8px 8px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
.pop button.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:.85rem}
.pop button.opt:hover{background:var(--surface-2)}
.pop button.opt.cur{font-weight:700}
.pop .sep{border-top:1px solid var(--line);margin:4px 0}

.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:380px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.err{color:var(--bad);font-size:.88rem;margin:0}

.phone-stage{display:flex;justify-content:center;padding-block:20px 40px}
.phone{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:640px}
@media (max-width:520px){.phone-stage{padding-block:0}.phone{border-radius:0;border-width:0;min-height:calc(100vh - 56px)}}
.ph-head{padding:18px 18px 14px;background:var(--accent);color:var(--accent-ink)}
.ph-head h2{font-size:1.2rem}
.ph-head p{margin:2px 0 0;opacity:.85;font-size:.85rem}
.ph-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{position:sticky;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:var(--muted);font-size:.74rem;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.tabs .tb{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:.66rem;display:grid;place-items:center;font-weight:700;line-height:1}
.pav{border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle;background:var(--surface-2)}
.pav-t{display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--f-display)}
.who-av{display:flex;align-items:center;gap:10px;min-width:0}
.ph-hi{display:flex;align-items:center;gap:12px;padding-right:64px}
.ph-hi .pav{border:2px solid rgb(255 255 255 / .75)}
.tabbar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tabbar button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabbar button:hover{color:var(--ink)}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.news-item{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.news-item:last-child{border-bottom:0}
.news-body{margin:0;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;flex:none;margin-top:7px}
.pick-list{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 10px}
.pick-list label{display:flex;gap:6px;align-items:center;font-size:.85rem;padding:3px 4px;border-radius:4px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-list label:hover{background:var(--surface-2)}
.task{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.task{padding:0}
.task.urgent{border-left:4px solid var(--bad)}
.score-wrap{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.score{display:grid;grid-template-columns:minmax(150px,1fr) repeat(5,44px);gap:6px;align-items:center}
.score-h span{text-align:center;font-size:.75rem;color:var(--muted)}
.score label{position:relative;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;height:38px;cursor:pointer;font-weight:600;color:var(--muted)}
.score label input{position:absolute;opacity:0;width:1px;height:1px}
.score label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pill.gA{background:var(--good-soft);color:var(--good)} .pill.gB{background:var(--accent-soft);color:var(--accent)} .pill.gC{background:var(--warn-soft);color:var(--warn)} .pill.gD{background:var(--bad-soft);color:var(--bad)}

.fs{border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 14px;margin:0;min-width:0}
.fs legend{font-size:.82rem;color:var(--muted);padding:0 6px;font-weight:500}
.tabs button svg{width:20px;height:20px}

.clock{text-align:center;padding:6px 0 2px}

.clock .d{color:var(--muted);margin-top:6px}
.today-shift{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r);background:hsl(var(--h) var(--sh-s) var(--sh-l));color:var(--sh-ink)}
.today-shift.off{background:var(--off-bg);color:var(--off-ink)}
.today-shift .big{font-family:var(--f-mono);font-size:1.15rem}
.punch-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch{border:0;border-radius:14px;padding:18px 8px;font-family:var(--f-display);font-size:1.1rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}

.cal .dc.off{background:var(--off-bg);color:var(--off-ink)}

.bal span{font-size:.75rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:14px;z-index:80;font-weight:500;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast.bad{background:var(--bad);color:#fff}

.logo-chip{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:2px 5px}

.login-logo .logo-chip{padding:10px 14px;border-radius:14px}

.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#9cc93b,#1fa7a0,#1a6fbd,#6b2c8e,#d01f7e,#e8312f)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .n{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1.15}
.kpi .n small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .s{font-size:.8rem;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:start}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.vlegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.colchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.colchart .yax{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;height:220px;margin-top:-.5em;margin-bottom:-.5em}
.colchart .plot{position:relative;height:220px;border-bottom:1px solid var(--muted)}
.colchart .gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--grid)}
.colchart .cols{position:absolute;inset:0;display:grid;gap:3px;align-items:end}
.colchart .col{height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default;border-radius:4px 4px 0 0}
.colchart .col:hover{background:var(--surface-2)}
.colchart .stack{width:100%;max-width:22px;display:flex;flex-direction:column-reverse;gap:2px}
.colchart .cs{min-height:2px}
.colchart .stack .cs:last-child{border-radius:4px 4px 0 0}
.colchart .fut{width:100%;max-width:22px;height:2px;background:var(--grid)}
.colchart .xax{grid-column:2;display:grid;gap:3px;font-size:.7rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;padding-top:4px}
.colchart .xax span.we{color:var(--ink)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(70px,34%) minmax(0,1fr) auto;align-items:center;gap:8px;font-size:.85rem}
.hb .hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .hb-t{height:14px;display:flex;align-items:center}
.hb .hb-t i{display:block;height:14px;background:var(--c-bar);border-radius:0 4px 4px 0;min-width:2px}
.hb .hb-v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgb(0 0 0 / .18);font-size:.82rem;min-width:150px}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px}
.tip i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* HumanOS-style dashboard */
.ktiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.ktiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.ktiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kt{position:relative;overflow:hidden;border-radius:10px;padding:14px 16px;min-height:84px;color:#fff;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px}

.kt.k1{background:#1d2b4f}.kt.k2{background:#123d73}.kt.k3{background:#11787a}.kt.k4{background:#c2771a}.kt.k5{background:#5f9e2f}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--ink)}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.on small{color:inherit;opacity:.75}
.tlist,.llist{display:flex;flex-direction:column;max-height:640px;overflow:auto}
.trow,.lrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.trow:last-child,.lrow:last-child{border-bottom:0}

.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:1rem;color:#fff;background:hsl(var(--h) 45% 45%)}

.tp.good{background:#22a35a;color:#fff}.tp.bad{background:#d8433b;color:#fff}

/* ---------- หน้าเข้าสู่ระบบ สไตล์ระบบ OS ---------- */
html.gated,html.gated body{overflow:hidden}
.gate{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;color:#fafaf9;font-family:var(--f-body)}
.gate[hidden]{display:none}
.g-half{position:fixed;left:0;right:0;height:50.5%;background:#1c1917;transition:transform .8s cubic-bezier(.77,0,.18,1);z-index:0}
.g-top{top:0;background:radial-gradient(120% 90% at 50% 100%,#292524 0%,#1c1917 60%)}
.g-bot{bottom:0;background:radial-gradient(120% 90% at 50% 0%,#292524 0%,#1c1917 60%)}
.g-top::after,.g-bot::before{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#06b6d4 15%,#22c55e 30%,#eab308 45%,#f97316 55%,#ec4899 70%,#8b5cf6 85%,transparent);transform:scaleX(0);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 18px rgb(236 72 153 / .55)}
.g-top::after{bottom:0}.g-bot::before{top:0}
.gate.leaving .g-top::after,.gate.leaving .g-bot::before{transform:scaleX(1)}
.gate.open .g-top{transform:translateY(-101%)}.gate.open .g-bot{transform:translateY(101%)}
.gate.open{pointer-events:none}
.g-core{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .3s,transform .45s cubic-bezier(.2,.8,.2,1)}
.gate.leaving .g-core{opacity:0;transform:scale(1.08)}
.g-mark{position:relative;width:150px;height:150px;flex:none}
.g-ring{position:absolute;inset:0;width:100%;height:100%;animation:gSpin 6s linear infinite}
.g-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.g-glow{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgb(139 92 246 / .35),transparent 70%);animation:gGlow 2.4s ease-in-out .6s infinite both}
.g-disc{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgb(0 0 0 / .45)}
.g-disc .logo{height:auto;width:80px}
.g-disc .logo-text{color:#1c1917;font-weight:700;font-size:.8rem}
.g-title{margin-top:22px;color:#fafaf9;font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:.01em}
.g-sub{margin-top:4px;color:#a8a29e;font-size:.72rem;font-weight:600;letter-spacing:.45em;padding-left:.45em}
.g-status{margin-top:22px;color:#a8a29e;font-size:.9rem;min-height:1.4em}
.gate.ready .g-status{color:#5eead4}
.g-status.g-bad{color:#fca5a5}
.g-dots{display:flex;gap:9px;margin-top:14px;height:14px;align-items:center}
.g-dots i{width:9px;height:9px;border-radius:50%;animation:gBounce 1s ease-in-out infinite}
.g-dots i:nth-child(1){background:#06b6d4}.g-dots i:nth-child(2){background:#ec4899;animation-delay:.12s}.g-dots i:nth-child(3){background:#facc15;animation-delay:.24s}.g-dots i:nth-child(4){background:#fafaf9;animation-delay:.36s}
.gate.ready .g-dots i{animation:none}
.g-form{width:100%;max-width:340px;margin-top:22px;display:flex;flex-direction:column;gap:12px;text-align:left}
.g-form form{display:flex;flex-direction:column;gap:12px}

.g-lang button[aria-pressed="true"]{background:#fafaf9;color:#1c1917;font-weight:600}
.g-seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:99px;background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .1)}
.g-seg button{border:0;background:transparent;color:#a8a29e;border-radius:99px;padding:8px 6px;font:inherit;font-weight:500;cursor:pointer}
.g-seg button[aria-pressed="true"]{background:#44403c;color:#fafaf9;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12)}
.g-field{display:flex;flex-direction:column;gap:5px}
.g-field label{color:#d6d3d1;font-size:.85rem;font-weight:500}
.g-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #44403c;background:#0c0a09;color:#fafaf9;font:inherit;font-size:16px}
.g-field input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgb(139 92 246 / .3)}
.g-err{margin:0;color:#fca5a5;font-size:.85rem}
.g-enter{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;padding:13px 30px;border-radius:999px;color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;border:2px solid transparent;background:linear-gradient(#1c1917,#1c1917) padding-box,linear-gradient(90deg,#06b6d4,#22c55e,#eab308,#f97316,#ec4899,#8b5cf6) border-box;animation:gPulse 1.8s ease-in-out .5s infinite}
.g-enter:hover{background:linear-gradient(#292524,#292524) padding-box,linear-gradient(90deg,#06b6d4,#22c55e,#eab308,#f97316,#ec4899,#8b5cf6) border-box}
.g-enter:focus-visible{outline:2px solid #fafaf9;outline-offset:3px}
.g-enter:disabled{cursor:default;opacity:.85;animation:none}
.g-enter svg{width:16px;height:16px}
button.g-enter{width:100%}
.g-core>.g-enter{width:auto;margin-top:18px}
.g-hint{margin:0;color:#78716c;font-size:.8rem;text-align:center}
.g-link{margin-top:14px;border:0;background:none;color:#a8a29e;font:inherit;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.in-app .g-inst{display:none!important}
.gate.intro .g-ring circle{animation:gDraw .6s cubic-bezier(.4,0,.2,1) both}
.gate.intro .g-disc{animation:gPop .75s cubic-bezier(.34,1.56,.64,1) .35s both}
.gate.intro .g-title{animation:gUp .6s cubic-bezier(.2,.8,.2,1) .6s both}
.gate.intro .g-sub{animation:gTrack .9s cubic-bezier(.2,.8,.2,1) .7s both}
.gate.intro .g-status,.gate.intro .g-dots,.gate.intro .g-form,.gate.intro .g-link{animation:gUp .5s cubic-bezier(.2,.8,.2,1) .85s both}
@keyframes gSpin{to{transform:rotate(1turn)}}
@keyframes gDraw{from{stroke-dasharray:0 502.65}}
@keyframes gPop{from{transform:scale(.3);opacity:0}}
@keyframes gUp{from{transform:translateY(14px);opacity:0}}
@keyframes gTrack{from{letter-spacing:1.2em;opacity:0}}
@keyframes gGlow{50%{opacity:.4;transform:scale(.9)}}
@keyframes gBounce{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-6px);opacity:1}}
@keyframes gPulse{50%{box-shadow:0 0 22px rgb(236 72 153 / .35)}}
@media (max-height:640px){.g-mark{width:116px;height:116px}.g-disc{width:80px;height:80px;margin:-40px 0 0 -40px}.g-disc .logo{width:62px}.g-title{margin-top:14px;font-size:1.35rem}.g-form{margin-top:14px}}
@media (prefers-reduced-motion:reduce){.gate *,.gate *::before,.gate *::after{animation:none!important;transition-duration:.01s!important}}
</style>

function paintLogos(){document.querySelectorAll('img[data-logo]').forEach(im=>{if(im.dataset.done)return;im.dataset.done='1';im.onerror=()=>{const t=document.createElement('span');t.className='logo-text';t.textContent='OS Printing House';im.replaceWith(t)};im.src=LOGO})}
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const toMin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m};
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

const thD=s=>{if(!s)return '';const d=pd(s);return d.getDate()+' '+mons(d.getMonth())+' '+yr(d.getFullYear())};

/* 4-slot punch helpers: in / bout (ออกพัก) / bin (กลับเข้างาน) / out */
function shRel(sh){const i=toMin(sh.in);let o=toMin(sh.out);const night=o<=i;if(night)o+=1440;let bs=sh.bs?toMin(sh.bs):null,be=sh.be?toMin(sh.be):null;if(bs!=null&&bs<i)bs+=1440;if(be!=null&&be<i)be+=1440;return{i,o,bs,be,night}}
const relM=(t,R)=>{const m=toMin(t);return R.night&&m<R.i-360?m+1440:m};
function workMin(p,sh){if(!p.in||!p.out)return 0;const R=shRel(sh),a=relM(p.in,R),z=relM(p.out,R);if(z<=a)return 0;
  if(p.bout&&p.bin){const b1=relM(p.bout,R),b2=relM(p.bin,R);if(b1>a&&b2>=b1&&z>=b2)return (b1-a)+(z-b2)}
  if(!p.bout&&!p.bin)return z-a; /* ไม่ได้ลงเวลาพัก = ทำงานช่วงพัก (นับเป็นเวลาเกิน) */
  if(R.bs!=null&&R.be!=null&&a<=R.bs&&z>=R.be)return z-a-(R.be-R.bs);return z-a}
function otMin(p,sh){if(!p.out)return 0;const R=shRel(sh),z=relM(p.out,R);return Math.max(0,z-R.o)}
/* ไม่ได้กดออกพัก/เข้าหลังพัก แต่อยู่คร่อมช่วงพักของกะ = ทำงานช่วงพัก */
function brkMin(p,sh){if(!p.in||!p.out||p.bout||p.bin||!sh.bs||!sh.be)return 0;const R=shRel(sh),a=relM(p.in,R),z=relM(p.out,R);return a<=R.bs&&z>=R.be?R.be-R.bs:0}
const allOT=(p,sh)=>otMin(p,sh)+brkMin(p,sh);

  const today=TODAY(),emp=empBy(id);

}

      .withSuccessHandler(r=>{S.busy--;busyEl.hidden=!S.busy;
        if(r&&r.error){if(r.auth){logoutLocal();}reject(new Error(r.error));return}

const SER=[['ok','ตรงเวลา','--c-ok'],['leave','ลา','--c-leave'],['late','สาย','--c-late'],['absent','ขาดงาน','--c-absent']];
function monthStats(y,m){
  const n=dim(y,m),today=TODAY(),emps=activeEmps(),days=[];
  const tot={ok:0,late:0,absent:0,leave:0,lateMin:0};
  for(let i=1;i<=n;i++){
    const d=ds(new Date(y,m,i)),o={d,ok:0,late:0,absent:0,leave:0,future:d>today};
    if(!o.future)emps.forEach(e=>{const st=dayStatus(e.id,d);if(['ok','late','absent','leave'].includes(st.k)){o[st.k]++;tot[st.k]++;if(st.k==='late')tot.lateMin+=st.late}});
    days.push(o);
  }
  const att=tot.ok+tot.late+tot.absent;
  return {days,tot,rate:att?(tot.ok+tot.late)/att:null,ontime:(tot.ok+tot.late)?tot.ok/(tot.ok+tot.late):null};
}

const tipEl=document.getElementById('tip');
function showTip(el,x,y){
  let h='';
  if(el.dataset.tip==='day'&&S._board){const o=S._board.days[+el.dataset.i];if(!o)return;
    if(o.future)h=`<b>${DOW[pd(o.d).getDay()]}. ${thD(o.d)}</b><span class="muted">ยังไม่ถึงวัน</span>`;
    else{const t=o.ok+o.late+o.absent+o.leave;h=`<b>${DOW[pd(o.d).getDay()]}. ${thD(o.d)}</b>`+(t?SER.map(([k,lab,c])=>`<div class="r"><span><i style="background:var(${c})"></i>${lab}</span><b style="margin:0">${o[k]}</b></div>`).join(''):'<span class="muted">วันหยุด / ไม่มีข้อมูล</span>')}}
  else if(el.dataset.tip==='txt')h=esc(el.dataset.t);
  if(!h)return;
  tipEl.innerHTML=h;tipEl.hidden=false;
  const w=tipEl.offsetWidth,hh=tipEl.offsetHeight;
  let lx=x+14,ly=y-hh-12;if(lx+w>innerWidth-8)lx=x-w-14;if(ly<8)ly=y+16;

}
document.addEventListener('mousemove',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(el)showTip(el,ev.clientX,ev.clientY);else tipEl.hidden=true});
document.addEventListener('focusin',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else tipEl.hidden=true});
document.addEventListener('touchstart',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(el){const t=ev.touches[0];showTip(el,t.clientX,t.clientY)}else tipEl.hidden=true},{passive:true});

/* schedule grid */
function vSched(){
  const b=S.b,{y,m}=S.ym,n=dim(y,m),today=TODAY();
  const emps=activeEmps().filter(e=>S.dept==='all'||e.dept===S.dept);
  const days=[...Array(n)].map((_,i)=>ds(new Date(y,m,i+1)));
  const pc=Object.keys(S.pending).length;
  const head=days.map(d=>{const w=pd(d).getDay();const cls=[b.holidays[d]?'hol':(w===0||w===6?'wk':''),d===today?'today':''].join(' ');return `<th class="${cls}" title="${esc(b.holidays[d]||DOWF[w])}">${pd(d).getDate()}<small>${DOW[w]}.</small></th>`}).join('');
  const body=emps.map(e=>`<tr><th class="emp" scope="row"><b>${esc(e.id)}</b><span>${esc(fullName(e))}${e.nick?' ('+esc(e.nick)+')':''}</span></th>${days.map(d=>{const k=e.id+'|'+d,c=cell(e.id,d,true),sh=shBy(c.s),lv=leaveOn(e.id,d,'approved');
    return `<td class="c ${c.off?'off':''} ${lv&&!c.off?'lv':''} ${S.pending[k]?'dirty':''}" style="--h:${sh.h}" title="${esc(fullName(e))} · ${thD(d)}${lv?' · '+esc(ltName(lv.type)):''}"><div class="in"><button class="code" data-act="cellpop" data-k="${esc(k)}" aria-label="เปลี่ยนกะ ${esc(e.id)} วันที่ ${pd(d).getDate()}">${esc(shN(sh))}</button><input type="checkbox" data-act="celloff" data-k="${esc(k)}" ${c.off?'checked':''} aria-label="ไม่ต้องทำงาน ${esc(e.id)} วันที่ ${pd(d).getDate()}"></div></td>`}).join('')}</tr>`).join('');
  return `<div class="head"><div><h2>ตารางการทำงาน</h2><p>คลิกชื่อกะเพื่อเปลี่ยน ติ๊กช่องเพื่อตั้งเป็นวันไม่ต้องทำงาน แล้วกดบันทึก</p></div></div>
  <section class="card"><div class="card-h"><h3>กะงานทั้งหมด</h3><span class="spacer"></span><button class="btn sm" data-act="view" data-v="shifts">จัดการกะ</button></div><div class="card-b shift-chips">${b.shifts.map(s=>`<span class="shift-chip" style="--h:${s.h}"><b>${esc(shN(s))}</b><span class="mono">${esc(s.in)}–${esc(s.out)}</span></span>`).join('')}</div></section>
  <div class="sched-tools">
    ${monthNav('ym')}
    <select id="dept-sel" class="ctl" data-act="dept" aria-label="แผนก"><option value="all">ทุกแผนก</option>${b.settings.depts.map(d=>`<option ${S.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <span class="spacer"></span>
    <div class="legend"><span><i class="lg" style="background:var(--off-bg)"></i>ไม่ต้องทำงาน</span><span><i class="lg" style="background:var(--hol-bg)"></i>นักขัตฤกษ์</span><span><i class="lg" style="background:var(--wk-bg)"></i>เสาร์–อาทิตย์</span><span><i class="lg" style="background:repeating-linear-gradient(135deg,var(--leave-bg) 0 4px,transparent 4px 7px)"></i>ลา</span></div>
  </div>
  <div class="row"><span>รายการที่มีการเปลี่ยนแปลง: <b>${pc?pc+' ช่อง':'ไม่มี'}</b></span><button class="btn pri" data-act="sched-save" ${pc?'':'disabled'}>บันทึก</button><button class="btn" data-act="sched-cancel" ${pc?'':'disabled'}>ยกเลิก</button></div>
  <div class="grid-wrap" id="grid-wrap"><table class="sg"><thead><tr><th class="emp">พนักงาน</th>${head}</tr></thead><tbody>${body||`<tr><td class="empty" colspan="${n+1}">ไม่มีพนักงานในแผนกนี้</td></tr>`}</tbody></table></div>`;
}

/* time records */

  const info=S.importInfo;
  return `<div class="head"><div><h2>บันทึกเวลา</h2><p>ดูและแก้เวลาเข้า–ออกรายวัน หรือนำเข้าไฟล์จากเครื่องสแกน</p></div></div>
  <section class="card"><div class="card-h"><h3>เวลาเข้า–ออก</h3><span class="spacer"></span><div class="row"><button class="icon-btn" data-act="tdate" data-v="-1" aria-label="วันก่อน">‹</button><input id="time-date" class="ctl" type="date" value="${d}" max="${today}" data-act="time-date" aria-label="วันที่"><button class="icon-btn" data-act="tdate" data-v="1" aria-label="วันถัดไป" ${d>=today?'disabled':''}>›</button></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>พนักงาน</th><th>กะ</th><th>เข้า</th><th>ออกพัก</th><th>เข้าหลังพัก</th><th>ออก</th><th>ทำงาน</th><th>ที่มา</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${rows.map(({e,c,sh,p,st})=>`<tr data-emp="${esc(e.id)}"><td>${whoCell(e)}</td><td class="mono">${c.off?'หยุด':esc(shN(sh)+' '+sh.in+'–'+sh.out)}</td><td><input type="time" id="ti-${esc(e.id)}" value="${esc(p.in||'')}" aria-label="เวลาเข้า ${esc(e.id)}"></td><td><input type="time" id="tbo-${esc(e.id)}" value="${esc(p.bout||'')}" aria-label="เวลาออกพัก ${esc(e.id)}"></td><td><input type="time" id="tbi-${esc(e.id)}" value="${esc(p.bin||'')}" aria-label="เวลาเข้าหลังพัก ${esc(e.id)}"></td><td><input type="time" id="to-${esc(e.id)}" value="${esc(p.out||'')}" aria-label="เวลาออก ${esc(e.id)}"></td><td class="mono" style="font-size:.85rem">${(()=>{const w=workMin(p,sh),o=allOT(p,sh);return w?fmtH(w)+(o>=30?` <span style="color:var(--warn)">+${fmtH(o)}</span>`:''):'–'})()}</td><td class="muted" style="font-size:.82rem">${esc(p.src||'–')}</td><td>${pill(st)}</td><td><button class="btn sm" data-act="punch-save" data-id="${esc(e.id)}">บันทึก</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">ยังไม่มีพนักงาน</td></tr>`}
  </tbody></table></div></section>
  <section class="card"><div class="card-h"><h3>นำเข้าเวลาจากเครื่องสแกน</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">
    <p class="muted" style="margin:0">รองรับไฟล์ .csv, .txt หรือ .dat ที่ดาวน์โหลดจากเครื่องสแกน แต่ละบรรทัดต้องมีรหัสพนักงาน (หรือรหัสในเครื่องสแกน) วันที่ และเวลา ระบบจะจัดเวลาให้เป็น เข้า / ออกพัก / เข้าหลังพัก / ออก ตามเวลากะให้อัตโนมัติ (กะดึกที่ออกหลังเที่ยงคืนนับรวมเป็นวันเดียวกับวันที่เข้ากะ)</p>
    <div class="row"><input type="file" id="imp-file" accept=".csv,.txt,.dat,.tsv" data-act="imp-file"></div>
    ${info?`<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:6px"><b>${info.rows} รายการสแกน · ${info.ids} รหัส · ${thD(info.from)} – ${thD(info.to)}</b>${info.unknown.length?`<span style="color:var(--warn)">ไม่พบรหัสเหล่านี้ในระบบ: ${esc(info.unknown.slice(0,15).join(', '))}${info.unknown.length>15?' …':''} (ใส่ "รหัสในเครื่องสแกน" ในหน้าพนักงานก่อน)</span>`:''}${info.skipped?`<span class="muted">ข้าม ${info.skipped} บรรทัดที่อ่านไม่ได้</span>`:''}<div class="row"><button class="btn pri" data-act="imp-go" ${info.rows?'':'disabled'}>นำเข้า</button><button class="btn" data-act="imp-cancel">ยกเลิก</button></div></div>`:''}
  </div></section>`;
}

/* employees */
function vEmps(){
  const f=S.empForm,b=S.b;

  <section class="card"><div class="card-h"><input id="emp-q" class="ctl" type="search" placeholder="ค้นหารหัส ชื่อ ชื่อเล่น" style="flex:1;min-width:160px" data-act="emp-q" aria-label="ค้นหาพนักงาน"><select id="emp-dept" class="ctl" data-act="emp-dept" aria-label="แผนก"><option value="all">ทุกแผนก</option>${b.settings.depts.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div>
  ${b.emps.length?`<div class="tbl-wrap"><table class="tbl" id="emp-tbl"><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>แผนก</th><th>ประเภท</th><th>กะหลัก</th><th>วันหยุดประจำ</th><th>เริ่มงาน</th><th>เบอร์โทร</th><th>รหัสสแกน</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${b.emps.map(e=>{const sh=shBy(e.shift);return `<tr data-q="${esc((e.id+' '+fullName(e)+' '+e.nick).toLowerCase())}" data-dept="${esc(e.dept)}"><td class="mono">${esc(e.id)}</td><td><div class="who-av">${avatar(e,30)}<span>${esc(e.pre+fullName(e))} ${e.nick?`<span class="muted">(${esc(e.nick)})</span>`:''}</span></div></td><td>${esc(e.dept)}</td><td>${esc(etName(e.etype))||'<span class="muted">–</span>'}</td><td><span class="swatch" style="--h:${sh.h}"></span> ${esc(shN(sh))}</td><td>${e.offDays.map(d=>DOWF[d]).join(', ')||'–'}</td><td>${thD(e.start)}</td><td class="mono">${esc(e.phone||'–')}</td><td class="mono">${esc(e.scanId||'–')}</td><td>${e.active?'<span class="pill ok">ทำงาน</span>':'<span class="pill off">ลาออก</span>'}</td><td><button class="btn sm" data-act="emp-edit" data-id="${esc(e.id)}">แก้ไข</button></td></tr>`}).join('')}
  </tbody></table></div>`:`<div class="empty"><p>ยังไม่มีพนักงาน กด "เพิ่มพนักงาน" เพื่อเริ่ม</p><button class="btn" data-act="seed">หรือลองใส่ข้อมูลตัวอย่าง</button></div>`}</section>`;
}

    <div class="field"><label for="ef-pre">คำนำหน้า</label><select id="ef-pre" name="pre">${['นาย','นาง','นางสาว'].map(p=>`<option ${f.pre===p?'selected':''}>${p}</option>`).join('')}</select></div>

/* shifts */

  ${f?`<section class="card"><div class="card-h"><h3>${f._new?'เพิ่มกะ':'แก้ไข'+esc(shN(f))}</h3></div><form class="card-b" id="sh-form" style="display:flex;flex-direction:column;gap:14px"><div class="grid-form">

  </div><div class="row"><span class="shift-chip" id="sf-prev" style="--h:${f.h}"><b>${esc(f.name||'กะใหม่')}</b>ตัวอย่างสี</span><span class="spacer"></span><button class="btn pri" type="submit">บันทึก</button><button class="btn" type="button" data-act="sh-close">ยกเลิก</button>
  ${f._new?'':(S.confirmDel==='sh:'+f.id?`<button class="btn danger" type="button" data-act="sh-del" data-id="${esc(f.id)}">ยืนยันลบกะ</button><button class="btn" type="button" data-act="del-cancel">ไม่ลบ</button>`:`<button class="btn no" type="button" data-act="ask-del" data-v="sh:${esc(f.id)}">ลบกะ</button>`)}</div></form></section>`:''}

  </tbody></table></div></section>`;
}

/* leave */
function balances(empId,year){
  return S.b.leaveTypes.map(t=>{const mine=S.b.leaves.filter(l=>l.emp===empId&&l.type===t.id&&l.from.slice(0,4)===year);
    const used=mine.filter(l=>l.status==='approved').reduce((a,l)=>a+l.days,0);
    const pend=mine.filter(l=>l.status==='pending').reduce((a,l)=>a+l.days,0);
    const adj=(S.b.leaveAdj||[]).filter(a=>a.emp===empId&&a.type===t.id&&a.year===year).reduce((a,x)=>a+x.days,0),ent=t.days+adj;
    return {t,used,pend,ent,adj,left:ent-used-pend}});
}

/* report */
function reportRows(){
  const {y,m}=S.ym,first=ds(new Date(y,m,1)),last=ds(new Date(y,m,dim(y,m))),today=TODAY();
  const end=last<today?last:today;
  const rows=activeEmps().map(e=>{const r={e,work:0,came:0,lateN:0,lateM:0,absent:0,leave:0,off:0};
    if(first<=end)for(let d=first;d<=end;d=addD(d,1)){const st=dayStatus(e.id,d);if(st.k==='na')continue;if(st.k==='off'){r.off++;continue}if(st.k==='leave'){r.leave++;continue}r.work++;if(st.k==='ok'||st.k==='late')r.came++;if(st.k==='late'){r.lateN++;r.lateM+=st.late}if(st.k==='absent')r.absent++}
    return r});
  return {rows,first,end};
}

function resizePhoto(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej(new Error('อ่านไฟล์รูปไม่ได้'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('อ่านไฟล์รูปไม่ได้ ลองใช้ไฟล์ .jpg หรือ .png'));
    im.onload=()=>{const N=160,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),s=Math.min(im.width,im.height);
      g.fillStyle='#fff';g.fillRect(0,0,N,N);g.drawImage(im,(im.width-s)/2,(im.height-s)*.3,s,s,0,0,N,N);
      let q=.82,u=c.toDataURL('image/jpeg',q);while(u.length>40000&&q>.3){q-=.12;u=c.toDataURL('image/jpeg',q)}res(u)};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

const IMP_COLS=[['id',['รหัส','รหัสพนักงาน','id']],['pre',['คำนำหน้า']],['first',['ชื่อ']],['last',['นามสกุล']],['nick',['ชื่อเล่น']],['dept',['แผนก']],['shift',['กะ','กะหลัก','กะงาน']],['etype',['ประเภท','ประเภทพนักงาน']],
  ['start',['วันเริ่มงาน','เริ่มงาน']],['birth',['วันเกิด']],['phone',['เบอร์โทร','โทรศัพท์']],['scanId',['รหัสสแกน','รหัสในเครื่องสแกน']],['pin',['pin','รหัส pin']],['addr',['ที่อยู่']],['emerName',['ผู้ติดต่อฉุกเฉิน']],['emerRel',['ความสัมพันธ์']],['emerPhone',['เบอร์ผู้ติดต่อฉุกเฉิน','เบอร์ฉุกเฉิน']]];
function normDate(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return (+m[1]>2400?+m[1]-543:+m[1])+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return (+m[3]>2400?+m[3]-543:+m[3])+'-'+pad(+m[2])+'-'+pad(+m[1]);return s}
function parseEmpTable(txt){
  const lines=String(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());if(lines.length<2)return {rows:[],err:'ต้องมีหัวตารางและข้อมูลอย่างน้อย 1 แถว'};
  const sep=lines[0].includes('\t')?'\t':',';
  const split=l=>{if(sep==='\t')return l.split('\t');const o=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===','&&!q){o.push(cur);cur='';continue}cur+=ch}o.push(cur);return o};
  const hdr=split(lines[0]).map(h=>h.trim().toLowerCase().replace(/\s+/g,' '));
  const map=hdr.map(h=>{const c=IMP_COLS.find(([,ns])=>ns.some(n=>n.toLowerCase()===h));return c?c[0]:null});
  if(!map.includes('id'))return {rows:[],err:'ไม่พบคอลัมน์ "รหัส" ในหัวตาราง'};
  const rows=lines.slice(1).map(l=>{const v=split(l),o={};map.forEach((k,i)=>{if(k&&v[i]!=null&&String(v[i]).trim()!=='')o[k]=String(v[i]).trim()});if(o.start)o.start=normDate(o.start);if(o.birth)o.birth=normDate(o.birth);return o}).filter(o=>o.id);
  return {rows,cols:map.filter(Boolean),unknown:hdr.filter((h,i)=>!map[i])}}

/* ---------- scanner file parser ---------- */
function parseScanFile(text,known){
  const out=[];let skipped=0;
  const dRe=/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})|(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/;
  const tRe=/(\d{1,2}):(\d{2})(?::\d{2})?/;
  text.split(/\r?\n/).forEach(line=>{
    const L=line.trim();if(!L)return;
    const dm=L.match(dRe),tm=L.slice(dm?dm.index+dm[0].length:0).match(tRe)||L.match(tRe);
    if(!dm||!tm){skipped++;return}
    let y,mo,da;if(dm[1]){y=+dm[1];mo=+dm[2];da=+dm[3]}else{da=+dm[4];mo=+dm[5];y=+dm[6]}
    if(y>2400)y-=543;
    if(mo<1||mo>12||da<1||da>31||+tm[1]>23){skipped++;return}
    const before=L.slice(0,dm.index).split(/[\s,;\t]+/).map(s=>s.replace(/^"|"$/g,'')).filter(Boolean);
    const cand=before.filter(s=>/^[A-Za-z0-9_-]+$/.test(s));
    const id=cand.find(s=>known.has(s)||known.has(s.toUpperCase()))||cand[0];
    if(!id){skipped++;return}
    out.push({id,date:y+'-'+pad(mo)+'-'+pad(da),time:pad(+tm[1])+':'+tm[2]});
  });
  return {rows:out,skipped};
}

      exportTo(('ประเมิน '+r.name).replace(/[\[\]*?:\/\\]/g,' ').slice(0,90),['รหัส','ชื่อ-นามสกุล','แผนก'].concat(r.crit,['เฉลี่ย','เกรด','ความเห็น','ประเมินเมื่อ']),
        evs.map(x=>{const e=empBy(x.emp)||{id:x.emp,first:x.emp,last:'',dept:''};return [e.id,fullName(e),e.dept].concat(x.scores,[x.avg,x.grade,x.comment,x.at])}));break}
    /* data management */
    case 'imp-emp-check':{S.empImportText=document.getElementById('imp-text').value;S.empImport=parseEmpTable(S.empImportText);render();break}
    case 'imp-emp-cancel':S.empImport=null;S.empImportText='';render();break;
    case 'imp-emp-go':{const rows=S.empImport&&S.empImport.rows;if(!rows||!rows.length)break;act('importEmps',{rows},()=>{S.empImport=null;S.empImportText=''});break}
    case 'exp-template':exportTo('แบบฟอร์มนำเข้าพนักงาน',['รหัส','คำนำหน้า','ชื่อ','นามสกุล','ชื่อเล่น','แผนก','กะ','ประเภท','วันเริ่มงาน','วันเกิด','เบอร์โทร','PIN','ที่อยู่','ผู้ติดต่อฉุกเฉิน','ความสัมพันธ์','เบอร์ผู้ติดต่อฉุกเฉิน'],
      activeEmps().map(e=>[e.id,e.pre,e.first,e.last,e.nick,e.dept,shN(shBy(e.shift)),e.etype,e.start,e.birth,e.phone,'',e.addr,e.emerName,e.emerRel,e.emerPhone]));break;
    case 'exp-emps':exportTo('รายชื่อพนักงาน',EMP_EXPORT_HDR,S.b.emps.map(empExportRow));break;
    case 'bulk-go':{const ids=pkSel('bk'),set={};const g=id=>document.getElementById(id).value;
      if(g('bk-dept'))set.dept=g('bk-dept');if(g('bk-shift'))set.shift=g('bk-shift');if(g('bk-etype'))set.etype=g('bk-etype');if(g('bk-active'))set.active=g('bk-active')==='1';
      if(document.getElementById('bk-off-on').checked)set.offDays=[...document.querySelectorAll('input[name=bkoff]:checked')].map(x=>+x.value);
      if(!ids.length){toast('ยังไม่ได้เลือกพนักงาน',true);break}act('bulkEmps',{ids,set});break}
    case 'adj-save':{const y=S.adjYear||TODAY().slice(0,4),rows=[];document.querySelectorAll('#adj-tbl tbody tr').forEach(tr=>tr.querySelectorAll('input').forEach(i=>rows.push({emp:tr.dataset.emp,type:i.name,days:i.value===''?0:Number(i.value)})));
      act('saveLeaveAdj',{year:y,rows});break}
    case 'backup':act('backupNow',{},r=>{if(r.extra&&r.extra.url)S.backupUrl=r.extra.url});break;
    case 'rep-leave-exp':{const y=S.repYear||TODAY().slice(0,4),lt=S.b.leaveTypes;
      exportTo('สรุปการลา '+(+y+543),['รหัส','ชื่อ-นามสกุล','แผนก'].concat(...lt.map(t=>[t.name+' ใช้',t.name+' สิทธิ์'])).concat(['รวมลา']),activeEmps().map(e=>{const bl=balances(e.id,y);return [e.id,fullName(e),e.dept].concat(...bl.map(x=>[x.used,x.ent])).concat([bl.reduce((a,x)=>a+x.used,0)])}));break}
    case 'rep-ot-exp':{const {y,m}=S.ym,ym=y+'-'+pad(m+1),ots=(S.b.ots||[]).filter(o=>o.date.slice(0,7)===ym&&o.status==='approved');
      exportTo('OT '+ym,['รหัส','ชื่อ-นามสกุล','แผนก','วันที่','เริ่ม','ถึง','ชั่วโมง','อัตรา (เท่า)','รายละเอียด'],ots.sort((a,c)=>a.emp.localeCompare(c.emp)||a.date.localeCompare(c.date)).map(o=>{const e=empBy(o.emp)||{id:o.emp,first:o.emp,last:'',dept:''};return [e.id,fullName(e),e.dept,o.date,o.from,o.to,o.hours,o.mult,o.reason]}));break}
    case 'punch':b.disabled=true;act('punch',{});break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,a=t.dataset.act;
  if(a==='dept'){S.dept=t.value;render()}
  if(a==='dash-date'&&t.value){S.dashDate=t.value>TODAY()?TODAY():t.value;render()}
  if(a==='lv-decide'&&t.value){act('decideLeave',{id:t.dataset.id,status:t.value})}
  if(a==='rep-date'&&t.value){S.repDate=t.value>TODAY()?TODAY():t.value;render()}
  if(a==='time-date'&&t.value){S.timeDate=t.value>TODAY()?TODAY():t.value;render()}
  if(a==='emp-dept')filterEmps();
  if(a==='pk-dept')pkFilter(t.dataset.pk);
  if(t.name==='emps'&&t.closest('.picker'))pkCount(t.closest('.picker').id);
  if(a==='eval-round'){S.evalRound=t.value;S.evalEmp=null;render()}
  if(a==='eval-dept'){S.evalDept=t.value;render()}
  if(a==='adj-year'){S.adjYear=t.value;render()}
  if(a==='rep-year'){S.repYear=t.value;render()}
  if(a==='photo-file'&&t.files[0]){const id=t.dataset.id;resizePhoto(t.files[0]).then(img=>act('savePhoto',{emp:id,img},r=>{S.photos[id]=img;if(r.extra&&r.extra.ver){S.photoVer=r.extra.ver;savePhotoCache()}})).catch(e=>toast(e.message,true))}
  if(a==='imp-emp-file'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{S.empImportText=String(fr.result);S.empImport=parseEmpTable(S.empImportText);render()};fr.readAsText(t.files[0])}
  if(a==='imp-file'&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const known=new Set();S.b.emps.forEach(e=>{known.add(e.id.toUpperCase());if(e.scanId)known.add(e.scanId)});
      const {rows,skipped}=parseScanFile(String(fr.result),known);
      const ids=[...new Set(rows.map(r=>r.id))],dates=rows.map(r=>r.date).sort();
      S.importRows=rows;S.importInfo={rows:rows.length,ids:ids.length,from:dates[0],to:dates[dates.length-1],skipped,unknown:ids.filter(i=>!known.has(i)&&!known.has(i.toUpperCase()))};
      if(!rows.length)toast('อ่านเวลาจากไฟล์นี้ไม่ได้ ตรวจสอบว่าแต่ละบรรทัดมีรหัส วันที่ และเวลา',true);
      render();};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.act==='emp-q')filterEmps();
  if(t.dataset.act==='pk-q')pkFilter(t.dataset.pk);
  if(t.dataset.act==='dash-q'){const q=t.value.trim().toLowerCase();document.querySelectorAll('#tlist .trow').forEach(r=>{r.hidden=!r.dataset.q.includes(q)})}
  if(t.dataset.act==='sh-hue'){const p=document.getElementById('sf-prev');if(p)p.style.setProperty('--h',t.value)}
});
function filterEmps(){const q=(document.getElementById('emp-q')?.value||'').trim().toLowerCase(),d=document.getElementById('emp-dept')?.value||'all';
  document.querySelectorAll('#emp-tbl tbody tr').forEach(r=>{r.hidden=!(r.dataset.q.includes(q)&&(d==='all'||r.dataset.dept===d))})}
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,fd=new FormData(f),fid=f.getAttribute('id');
  if(fid==='login-form')doLogin();
  if(fid==='emp-form'){
    const o={id:fd.get('id').trim().toUpperCase(),pre:fd.get('pre'),first:fd.get('first'),last:fd.get('last'),nick:fd.get('nick'),dept:fd.get('dept'),pos:S.empForm.pos||'',start:fd.get('start'),shift:fd.get('shift'),phone:fd.get('phone'),scanId:fd.get('scanId'),active:fd.get('active')==='1',offDays:fd.getAll('off').map(Number),
      etype:fd.get('etype'),birth:fd.get('birth'),addr:fd.get('addr'),emerName:fd.get('emerName'),emerRel:fd.get('emerRel'),emerPhone:fd.get('emerPhone')};
    act('saveEmp',{emp:o,isNew:!!S.empForm._new,pin:fd.get('pin')},()=>{S.empForm=null});
  }
  if(fid==='sh-form'){
    act('saveShift',{isNew:!!S.shiftForm._new,shift:{id:S.shiftForm._new?'':S.shiftForm.id,name:fd.get('name'),in:fd.get('in'),out:fd.get('out'),bs:fd.get('bs'),be:fd.get('be'),grace:fd.get('grace'),h:fd.get('h')}},()=>{S.shiftForm=null});
  }
  if(fid==='hol-form')act('saveHoliday',{date:fd.get('date'),name:fd.get('name')});
  if(fid==='set-form')act('saveSettings',{allowPhonePunch:!!fd.get('allowPhonePunch')});
  if(fid==='co-form')act('saveCompany',{shopName:fd.get('shopName'),coName:fd.get('coName'),coAddr:fd.get('coAddr'),coTax:fd.get('coTax'),coPhone:fd.get('coPhone')});
  if(fid==='dept-form'){const list=[...f.querySelectorAll('.dept-row')].filter(r=>!(r.querySelector('[name=del]')||{}).checked).map(r=>({old:r.dataset.old,name:r.querySelector('[name=name]').value.trim()})).filter(d=>d.name);act('saveDepts',{list})}
  if(fid==='et-form'){const types=[...f.querySelectorAll('.et-row')].map(r=>({id:r.querySelector('[name=id]').value.trim(),name:r.querySelector('[name=name]').value.trim()})).filter(x=>x.id||x.name);act('saveETypes',{types})}
  if(fid==='news-form')act('saveNews',{news:{id:S.newsForm.id,title:fd.get('title'),body:fd.get('body'),dept:fd.get('dept'),pin:!!fd.get('pin')}},()=>{S.newsForm=null});
  if(fid==='task-form'){const tf=S.taskForm,o={title:fd.get('title'),detail:fd.get('detail'),due:fd.get('due'),prio:fd.get('prio')};
    if(tf.grp)o.grp=tf.grp;else{o.emps=pkSel('tp');if(!o.emps.length){toast('กรุณาเลือกพนักงานที่จะมอบหมายงาน',true);return}}
    act('saveTask',{task:o},()=>{S.taskForm=null});}
  if(fid==='round-form')act('saveEvalRound',{round:{id:S.roundForm.id,name:fd.get('name'),from:fd.get('from'),to:fd.get('to'),crit:String(fd.get('crit')).split('\n').map(s=>s.trim()).filter(Boolean)}},()=>{S.evalRound=S.roundForm.id||null;S.roundForm=null});
  if(fid==='eval-form'){const r=S.b.evalRounds.find(x=>x.id===S.evalRoundCur),sc=r.crit.map((c,i)=>Number(fd.get('s'+i)||0));
    if(sc.some(x=>!x)){toast('กรุณาให้คะแนนครบทุกหัวข้อ',true);return}
    act('saveEval',{round:r.id,emp:S.evalEmp,scores:sc,comment:fd.get('comment')});}
  if(fid==='lt-form'){const ids=fd.getAll('id'),names=fd.getAll('name'),days=fd.getAll('days');
    act('saveLeaveTypes',{types:ids.map((id,i)=>({id,name:names[i].trim(),days:days[i]})).filter(t=>t.name)});}
  if(fid==='pw-form')act('changeAdminPass',{user:fd.get('user').trim(),old:fd.get('old'),pass:fd.get('pass')});
  if(fid==='pin-form')act('changePin',{old:fd.get('old'),pin:fd.get('pin')});
  if(fid==='adm-lv-form')act('requestLeave',{emp:fd.get('emp'),leave:{type:fd.get('type'),from:fd.get('from'),to:fd.get('to'),half:!!fd.get('half'),reason:fd.get('reason')}});
  if(fid==='ot-form')act('requestOT',{ot:{date:fd.get('date'),from:fd.get('from'),to:fd.get('to'),reason:fd.get('reason')}},()=>{S.otPrefill=null});
  if(fid==='fix-form')act('requestFix',{fix:{date:fd.get('date'),in:fd.get('in'),out:fd.get('out'),reason:fd.get('reason')}});
  if(fid==='adm-ot-form')act('requestOT',{emp:fd.get('emp'),ot:{date:fd.get('date'),from:fd.get('from'),to:fd.get('to'),mult:Number(fd.get('mult')),reason:fd.get('reason')}});
  if(fid==='money-form')act('saveMoney',{ym:payYmStr(),item:{emp:fd.get('emp'),kind:fd.get('kind'),name:fd.get('name'),amount:fd.get('amount'),from:fd.get('from'),to:fd.get('to')}},r=>{S.pay=r.extra&&r.extra.pay});
  if(fid==='lv-form')act('requestLeave',{leave:{type:fd.get('type'),from:fd.get('from'),to:fd.get('to'),half:!!fd.get('half'),reason:fd.get('reason')}});
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){hidePop();if(!document.getElementById('install').hidden)hideInstall()}});
addEventListener('resize',hidePop);
document.addEventListener('scroll',ev=>{if(ev.target&&ev.target.id==='grid-wrap')hidePop()},true);
setInterval(()=>{const c=document.getElementById('live-clock');if(c)c.textContent=clockStr()},1000);
/* keep the day fresh: reload data when the page comes back to the foreground */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.b&&!S.busy&&!S.guest)call('boot').then(render).catch(()=>{})});

/* ---------- login ---------- */
let loggingIn=false;
function doLogin(){
  if(loggingIn)return;
  const u=document.getElementById('lg-user'),p=document.getElementById('lg-pass'),err=document.getElementById('lg-err'),btn=document.getElementById('lg-btn');
  const showErr=(m,focusEl)=>{err.textContent=LM(m);err.hidden=false;if(focusEl)focusEl.focus()};
  err.hidden=true;
  if(!u.value.trim())return showErr(S.loginKind==='emp'?'กรุณาใส่รหัสพนักงาน':'กรุณาใส่ชื่อผู้ใช้',u);
  if(!p.value)return showErr(S.loginKind==='emp'?'กรุณาใส่ PIN':'กรุณาใส่รหัสผ่าน',p);
  loggingIn=true;btn.disabled=true;btn.textContent=L('กำลังเข้าสู่ระบบ…');
  call('login',{kind:S.loginKind,user:u.value,pass:p.value})
    .then(()=>{loggingIn=false;S.view='dash';S.empTab='clock';render()})
    .catch(e=>{loggingIn=false;btn.disabled=false;btn.innerHTML=G_PLAY+L('เข้าสู่ระบบ');p.value='';showErr(e.message,p)});
}
/* Enter: in the user field moves to the password field (or logs in if it is filled); in the password field logs in */
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||ev.isComposing)return;
  const id=ev.target&&ev.target.id;
  if(id==='lg-user'){ev.preventDefault();const p=document.getElementById('lg-pass');if(p.value)doLogin();else p.focus()}
  else if(id==='lg-pass'){ev.preventDefault();doLogin()}
});

/* ---------- start ---------- */
render();paintLogos();
/* opened from the installed OS HR app (?app=1): hide the install button */
try{google.script.url.getLocation(l=>{if(l&&l.parameter&&l.parameter.app==='1'){document.documentElement.classList.add('in-app');S.inApp=true;pushHello()}})}catch(e){}
if(S.token)resume();
})();
